[package]
name = "nfc_backend"
version = "0.1.3"
publish = false
authors = ["Max Böcker <max.boecker@rwth-aachen.de>"]
edition = "2021"

[dependencies]
futures-util = "0.3.29"
hex = "0.4.3"
pcsc = "2.8.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.93"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-serial = "5.4.4"
tokio-tungstenite = "0.20"
