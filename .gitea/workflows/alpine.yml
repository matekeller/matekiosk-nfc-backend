name: Alpine
on: [push]

jobs:
  abuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust package
        uses: docker://docker.io/library/rust:slim
        with:
          entrypoint: /usr/local/cargo/bin/cargo
          args: package --locked --no-verify
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      - name: Copy Rust package
        run: |
          pkgver=$(find target/package/ -name '*.crate' | sed -E -e 's,^.*-,,' -e 's,\.crate,,')
          sudo mv target/package/nfc_backend-$pkgver.crate alpine/
          sed -i -e "s,%pkgver%,$pkgver," alpine/APKBUILD
      - name: Build Alpine package
        uses: docker://ghcr.io/msrd0/abuild-aarch64:3.19
        with:
          entrypoint: ash
          args: -c './.gitea/workflows/alpine.sh git@msrd0.de-65a92c7e.rsa "${{secrets.ABUILD_KEY}}"'
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      - name: Upload to Gitea Packages
        run: |
          set -eux
          # upload new package
          cd packages/matekiosk-nfc-backend/aarch64/
          for file in $(find . -name '*.apk' -type f | sed -e 's,./,,'); do
            # remove old package
            curl \
              --fail \
              -H "Authorization: token ${{secrets.PACKAGE_TOKEN}}" \
              -X DELETE \
              "https://msrd0.dev/api/packages/matekeller/alpine/v3.19/matekiosk/$file" \
              || true
            
            # upload new package
            curl \
              --fail \
              -H "Authorization: token ${{secrets.PACKAGE_TOKEN}}" \
              -T "$file" \
              "https://msrd0.dev/api/packages/matekeller/alpine/v3.19/matekiosk"
          done
