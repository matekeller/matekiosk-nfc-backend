name: Alpine
on: [push]

jobs:
  abuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Rust package
        uses: docker://docker.io/library/rust:slim
        with:
          entrypoint: /usr/local/cargo/bin/cargo
          args: package --locked --no-verify
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      - name: Copy Rust package
        run: |
          pkgver=$(find target/package/ -name '*.crate' | sed -E -e 's,^.*-,,' -e 's,\.crate,,')
          mv target/package/nfc_backend-$pkgver.crate alpine/
          sed -i -e "s,%pkgver%,$pkgver," alpine/APKBUILD
      - name: Build Alpine package
        uses: docker://ghcr.io/msrd0/abuild-aarch64
        with:
          entrypoint: ash
          args: -c './.gitea/workflows/alpine.sh git@msrd0.de-641ad15a.rsa "${{secrets.ABUILD_KEY}}"'
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      - name: Upload to Gitea Packages
        run: |
          cd packages
          for file in $(find . -type f); do
            curl -T "$file" --header "Authorization: token ${{github.token}}" "https://msrd0.dev/api/packages/matekeller/generic/matekiosk-nfc-backend/3.17/$file"
          done
